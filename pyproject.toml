[project]
name = "mausamcover"
version = "0.1.0"
description = "Festive-week rain + basis-gap cover for mela stall owners, via WhatsApp (hackathon simulation)"
requires-python = ">=3.12"
dependencies = [
    "eth-tester[py-evm]>=0.14.0b1",
    "fastapi>=0.165.0",
    "flagsmith>=6.7.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "py-solc-x>=2.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[tool.uv]
package = false
